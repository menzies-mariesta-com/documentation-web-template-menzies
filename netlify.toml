[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  PUBLIC_SITE_URL = "https://wash-ui.menzies.design"

[dev]
  command = "npm run dev"
  targetPort = 5173

[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
